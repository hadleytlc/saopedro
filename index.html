<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <title>Telão Bingo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: white;
      height: 100%;
      font-family: 'Segoe UI Black', Impact, sans-serif;
      cursor: pointer;
    }

    .main-wrapper {
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      color: blue;
      background: white;
      user-select: none;
      align-items: center;
    }

    .container {
      display: flex;
      height: 90vh;
      align-items: center;
      gap: 3vw;
    }

    .bingo-panel {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 3vw;
      padding: 1vh;
      border: 8px solid blue;
      border-radius: 10px;
    }

    .bingo-column {
      display: grid;
      grid-template-rows: 8% repeat(15, 1fr);
      align-items: center;
      justify-items: center;
    }

    .bingo-column::before {
      content: attr(id);
      font-size: 5vw;
      font-weight: bold;
    }

    .bingo-column div {
      width: 5.5vw;
      height: calc(83vh / 16);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: min(5vw, 5vh);
      transform: translateY(4.5px);
      font-weight: bold;
      color: #DCDCDC;
      background-color: white;
      border: 2px solid #DCDCDC;
      border-radius: 0;
      transition: all 0.3s ease;
    }

    .bingo-column div.active {
      background-color: red;
      color: white;
      border: 1px solid blue;
      font-size: min(6vw, 6vh);
      font-family: 'Segoe UI Black', Impact, sans-serif;
    }

    .bingo-column div.history {
      background-color: white;
      color: blue;
      border: 2px solid red;
      font-size: min(6.5vw, 6.5vh);
    }

    .info-panel {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      height: 92vh;
    }

    .info-box {
      width: 45vw;
      height: 43vh;
      border: 8px solid blue;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 10px;
      position: relative;
    }

    .last-number {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: blue;
      height: 100%;
      padding-top: 0vh;
      gap: 0vh;
    }

    .last-letter {
      font-size: min(15vw, 15vh);
      font-weight: bold;
      line-height: 65%;
    }

    .last-num {
      font-size: min(40vw, 40vh);
      font-weight: bold;
      line-height: 65%;
    }

    .image-box {
      width: 100%;
      height: 100%;
      position: relative;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      background-position: center;
    }

    .image-buttons {
      position: absolute;
      bottom: 103%;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 0.5vw;
      align-items: center;
    }

    .counter {
      font-size: 2.7vw;
      padding: 0vw 0vw;
      background: transparent;
      border: 1px solid transparent;
      border-radius: 1px;
      color: red;
      font-weight: bold;
      white-space: nowrap;
    }

    .image-buttons button {
      font-size: 2.4vw;
      padding: 0.3vw 0.5vw;
      background: #eee;
      border: 0.5px solid blue;
      border-radius: 5px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .image-buttons button:hover {
      background: #ddd;
    }

    .cell-num {
      display: inline-block;
      transform: translateY(-2.5px);
    }
  </style>
</head>

<body oncontextmenu="return false;">
  <div class="main-wrapper">
    <div class="container">
      <div class="bingo-panel">
        <div class="bingo-column" id="B"></div>
        <div class="bingo-column" id="I"></div>
        <div class="bingo-column" id="N"></div>
        <div class="bingo-column" id="G"></div>
        <div class="bingo-column" id="O"></div>
      </div>
      <div class="info-panel">
        <div class="info-box">
          <div class="last-number">
            <div class="last-letter" id="last-letter">--</div>
            <div class="last-num" id="last-num">--</div>
          </div>
        </div>
        <div class="info-box">
          <div class="image-box" id="image-box">
            <div class="image-buttons">
              <div class="counter">SAÍRAM: <span id="marcado">0</span></div>
              <button id="reset-btn">Resetar</button>
              <div class="counter">RESTAM: <span id="restante">75</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const columns = {
      B: [1, 15],
      I: [16, 30],
      N: [31, 45],
      G: [46, 60],
      O: [61, 75],
    };

    const lastLetter = document.getElementById("last-letter");
    const lastNum = document.getElementById("last-num");

    // Função para atualizar os contadores
    function atualizarContadores() {
      const marcados = document.querySelectorAll(".bingo-column div.active, .bingo-column div.history").length;
      document.getElementById("marcado").textContent = marcados;
      document.getElementById("restante").textContent = 75 - marcados;
    }

    for (let letter in columns) {
      const col = document.getElementById(letter);
      const [start, end] = columns[letter];

      for (let i = start; i <= end; i++) {
        const cell = document.createElement("div");
        const formattedNum = i.toString().padStart(2, "0");
        cell.innerHTML = `<span class="cell-num">${formattedNum}</span>`;
        cell.dataset.letter = letter;
        cell.dataset.value = formattedNum;

        cell.addEventListener("click", () => {
          if (cell.classList.contains("active") || cell.classList.contains("history")) {
            const confirmUnmark = confirm(`Deseja desmarcar o número ${letter}${formattedNum}?`);
            if (confirmUnmark) {
              cell.classList.remove("active", "history");
              cell.style.backgroundColor = "white";
              cell.style.color = "#DCDCDC";

              if (lastLetter.textContent === letter && lastNum.textContent === formattedNum) {
                lastLetter.textContent = "--";
                lastNum.textContent = "--";
              }
              atualizarContadores(); // Atualiza contador ao desmarcar
              return;
            } else {
              return;
            }
          }

          document.querySelectorAll(".bingo-column div").forEach(c => {
            if (c.classList.contains("active")) {
              c.classList.remove("active");
              c.classList.add("history");
            }
          });

          cell.classList.add("active");
          cell.style.backgroundColor = "";
          cell.style.color = "";
          lastLetter.textContent = letter;
          lastNum.textContent = formattedNum;
          atualizarContadores(); // Atualiza contador ao marcar
        });

        col.appendChild(cell);
      }
    }

    document.getElementById("reset-btn").addEventListener("click", () => {
      document.querySelectorAll(".bingo-column div").forEach(c => {
        c.classList.remove("active", "history");
        c.style.backgroundColor = "white";
        c.style.color = "#DCDCDC";
      });
      lastLetter.textContent = "--";
      lastNum.textContent = "--";
      atualizarContadores(); // Atualiza contador ao resetar
    });

    document.getElementById("image-box").style.backgroundImage = "url('logo.jpeg')";

    let typedNumber = "";
    document.addEventListener("keydown", (e) => {
      if (/^[0-9]$/.test(e.key)) {
        typedNumber += e.key;
      } else if (e.key === "Enter") {
        const num = parseInt(typedNumber);
        if (!isNaN(num) && num >= 1 && num <= 75) {
          const allCells = document.querySelectorAll(".bingo-column div");
          const match = Array.from(allCells).find(el => parseInt(el.textContent) === num);
          if (match) {
            match.click();
          }
        }
        typedNumber = "";
      }
    });

    // BLOQUEIO DE TECLAS DEVTOOLS
    document.addEventListener("keydown", function (e) {
      if (
        e.key === "F12" ||
        (e.ctrlKey && e.shiftKey && e.key === "I") ||
        (e.ctrlKey && e.shiftKey && e.key === "J") ||
        (e.ctrlKey && e.key === "U") ||
        (e.ctrlKey && e.shiftKey && e.key === "C")
      ) {
        e.preventDefault();
        alert("Direitos Reservados a ®CS AVARÉ.");
      }
    });

    // DETECÇÃO SIMPLES DE DEVTOOLS
    setInterval(function () {
      const start = performance.now();
      debugger;
      const end = performance.now();
      if (end - start > 50) {
        alert("Uso de ferramentas de desenvolvedor detectado! Direitos Reservados a ®CS AVARÉ");
        window.location.href = "about:blank";
      }
    }, 1000);
  </script>
</body>
</html>
